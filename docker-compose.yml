services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: Sravya
      POSTGRES_PASSWORD: Sravya
      POSTGRES_DB: Ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Sravya -d Ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  qdrant_storage:
  postgres_storage:

